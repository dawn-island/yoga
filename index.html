<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Gallery</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0f0f0f;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 48px 20px;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      header h1 {
        font-size: 1.6rem;
        font-weight: 500;
        color: #f0f0f0;
        margin-bottom: 8px;
      }

      header p {
        font-size: 0.85rem;
        color: #666;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
        max-width: 1000px;
        margin: 0 auto;
      }

      .card {
        background: #1a1a1a;
        border: 0.5px solid #333;
        border-radius: 12px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        display: block;
        transition: border-color 0.2s, transform 0.2s;
      }

      .card:hover {
        border-color: #555;
        transform: translateY(-2px);
      }

      .thumbnail {
        position: relative;
        padding-bottom: 56.25%;
        background: #222;
        overflow: hidden;
      }

      .play-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .play-icon::after {
        content: "";
        display: block;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 8px 0 8px 16px;
        border-color: transparent transparent transparent #ffffff;
        margin-left: 3px;
      }

      .duration {
        position: absolute;
        bottom: 8px;
        right: 8px;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        font-size: 0.75rem;
        padding: 2px 6px;
        border-radius: 4px;
      }

      .info {
        padding: 14px 16px;
      }

      .info h2 {
        font-size: 0.95rem;
        font-weight: 500;
        color: #e0e0e0;
        margin-bottom: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
      }

      .date {
        font-size: 0.75rem;
        color: #555;
      }

      footer {
        text-align: center;
        margin-top: 48px;
        font-size: 0.8rem;
        color: #444;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Video Gallery</h1>
      <p>클릭하면 영상을 재생합니다</p>
    </header>

    <div class="grid"></div>

    <footer>© 2026 Yoga Video</footer>

    <script src="videos.js"></script>
    <script>
      const grid = document.querySelector('.grid');
      grid.innerHTML = VIDEOS.map((v, i) => `
        <a class="card" href="./player.html?v=${i}">
          <div class="thumbnail">
            <div class="play-icon"></div>
            ${v.duration ? `<span class="duration">${v.duration}</span>` : ''}
          </div>
          <div class="info">
            <h2>${v.title}</h2>
            <div class="meta"><span class="date">${v.date}</span></div>
          </div>
        </a>
      `).join('');
    </script>
  </body>
</html>
